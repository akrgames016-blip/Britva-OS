<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Britva OS Python edition preview</title>
  <desc id="desc">A rendered terminal preview of the safe Python host-side shell simulation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1a20"/><stop offset="1" stop-color="#081116"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1200" height="640" fill="url(#background)"/>
  <circle cx="1040" cy="4" r="210" fill="#33bcb7" opacity=".04"/>
  <g filter="url(#shadow)">
    <rect x="48" y="46" width="1104" height="542" rx="18" fill="#0e1b21" stroke="#29444d"/>
    <path d="M66 46h1068a18 18 0 0 1 18 18v44H48V64a18 18 0 0 1 18-18Z" fill="#12232a"/>
    <path d="M48 108h1104" stroke="#29444d"/>
    <circle cx="79" cy="81" r="6" fill="#e6877c"/><circle cx="99" cy="81" r="6" fill="#dfbd78"/><circle cx="119" cy="81" r="6" fill="#74c98e"/>
    <text x="151" y="86" fill="#d9e8eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.1">BRITVA / PYTHON EDITION</text>
    <circle cx="1015" cy="80" r="4" fill="#8ce8a6"/>
    <text x="1030" y="85" fill="#91aab2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">HOST SIM</text>
    <rect x="72" y="126" width="1056" height="430" rx="7" fill="#070f12" stroke="#1d343c"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
      <text x="104" y="166" fill="#718b94">$ python3 python/britva.py</text>
      <text x="104" y="205" fill="#5de2dc" font-weight="700">BRITVA OS</text>
      <text x="104" y="232" fill="#c2d1d5">Python edition 0.1.0 (safe host simulation)</text>
      <text x="104" y="259" fill="#8299a1">Type 'help' to list commands. Press Ctrl+C to leave.</text>
      <text x="104" y="304" fill="#5de2dc">britva@python:~$</text><text x="296" y="304" fill="#d9e8eb"> echo Hello from Britva</text>
      <text x="104" y="332" fill="#d9e8eb">Hello from Britva</text>
      <text x="104" y="374" fill="#5de2dc">britva@python:~$</text><text x="296" y="374" fill="#d9e8eb"> uname</text>
      <text x="104" y="402" fill="#d9e8eb">Britva 0.1.0 i386</text>
      <text x="104" y="444" fill="#5de2dc">britva@python:~$</text><text x="296" y="444" fill="#d9e8eb"> help</text>
      <text x="104" y="472" fill="#d9e8eb">Commands: help, about, version, uname, whoami, mem, echo,</text>
      <text x="104" y="499" fill="#d9e8eb">          ls, cat, color, clear, reboot</text>
      <text x="104" y="539" fill="#5de2dc">britva@python:~$</text><rect x="297" y="524" width="9" height="20" rx="1" fill="#5de2dc" opacity=".9"/>
    </g>
  </g>
  <text x="600" y="619" text-anchor="middle" fill="#718790" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">RENDERED VISUAL PREVIEW · PYTHON HOST SIMULATION</text>
</svg>
