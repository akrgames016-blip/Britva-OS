<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Britva OS boot console visual preview</title>
  <desc id="desc">A rendered preview of the Britva OS 32-bit x86 text console and built-in shell.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1a20"/><stop offset="1" stop-color="#081116"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#050c0f"/><stop offset="1" stop-color="#091317"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#background)"/>
  <circle cx="1060" cy="35" r="240" fill="#33bcb7" opacity=".035"/>
  <g filter="url(#shadow)">
    <rect x="48" y="46" width="1104" height="626" rx="18" fill="#0e1b21" stroke="#29444d"/>
    <path d="M66 46h1068a18 18 0 0 1 18 18v44H48V64a18 18 0 0 1 18-18Z" fill="#12232a"/>
    <path d="M48 108h1104" stroke="#29444d"/>
    <circle cx="79" cy="81" r="6" fill="#e6877c"/><circle cx="99" cy="81" r="6" fill="#dfbd78"/><circle cx="119" cy="81" r="6" fill="#74c98e"/>
    <text x="151" y="86" fill="#d9e8eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.1">BRITVA / VGA CONSOLE</text>
    <circle cx="1025" cy="80" r="4" fill="#8ce8a6"/>
    <text x="1040" y="85" fill="#91aab2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">32-BIT X86</text>
    <rect x="72" y="126" width="1056" height="516" rx="7" fill="url(#screen)" stroke="#1d343c"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve">
      <text x="100" y="160" fill="#5de2dc" font-weight="700">BRITVA OS 0.1.0</text>
      <text x="100" y="184" fill="#8299a1">32-bit x86 | freestanding C++ kernel | GNU Assembly boot</text>
      <text x="100" y="208" fill="#8299a1">VGA text console + COM1 serial console</text>
      <text x="100" y="232" fill="#8299a1">Memory map unavailable in this early build.</text>
      <text x="100" y="256" fill="#8299a1">Type 'help' to list commands.</text>

      <text x="100" y="292" fill="#5de2dc">britva@kernel:~$</text><text x="264" y="292" fill="#d9e8eb"> about</text>
      <text x="100" y="316" fill="#d9e8eb">Britva OS is a tiny, open-source x86 hobby operating system.</text>
      <text x="100" y="340" fill="#d9e8eb">It boots with GNU Assembly and runs a freestanding C++ kernel.</text>
      <text x="100" y="364" fill="#d9e8eb">This early build has a VGA text console and a polling shell.</text>

      <text x="100" y="400" fill="#5de2dc">britva@kernel:~$</text><text x="264" y="400" fill="#d9e8eb"> help</text>
      <text x="100" y="424" fill="#d9e8eb">Commands:</text>
      <text x="100" y="448" fill="#c5d6da">  help                 Show this list</text>
      <text x="100" y="472" fill="#c5d6da">  about                About Britva OS</text>
      <text x="100" y="496" fill="#c5d6da">  version              Show version and architecture</text>
      <text x="100" y="520" fill="#c5d6da">  uname                Print system identity</text>
      <text x="100" y="544" fill="#c5d6da">  whoami               Print current user</text>
      <text x="100" y="568" fill="#c5d6da">  mem                  Show memory status</text>
      <text x="100" y="592" fill="#c5d6da">  echo / ls / cat / color / clear / reboot</text>
    </g>
  </g>
  <text x="600" y="699" text-anchor="middle" fill="#718790" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">RENDERED VISUAL PREVIEW · NOT A QEMU CAPTURE</text>
</svg>
